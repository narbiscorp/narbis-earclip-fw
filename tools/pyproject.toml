[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narbis-tools"
version = "0.1.0"
description = "Host-side tools for the Narbis Edge Earclip (BLE client, protocol mirror of firmware proto.h)"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["narbis_client"]
