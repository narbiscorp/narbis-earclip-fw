[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narbis-tools"
version = "0.1.0"
description = "Host-side tools for the Narbis Edge Earclip (BLE client, protocol mirror of firmware proto.h)"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
viz = ["matplotlib"]
data = ["pandas", "pyarrow"]

[project.scripts]
narbis-record = "narbis_client.recorder:main"
narbis-plot = "narbis_client.liveplot:main"
narbis-knobs = "narbis_client.knobs:main"
narbis-ota = "narbis_client.ota:main"
narbis-selftest = "narbis_client.selftest:main"
narbis-timesync = "narbis_client.timesync:main"

[tool.setuptools]
packages = ["narbis_client"]
